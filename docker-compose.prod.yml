# =============================================================
# nasFinance - producao (Oracle Cloud, VM `nasfinance`)
# =============================================================
# Sobe com:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# SEM `--build`, de proposito: esta VM tem 1 OCPU e 954 MiB. Uma build
# Maven + Node nao cabe aqui. A imagem e construida na maquina de dev e
# enviada pronta (docker save | gzip), com sha256 conferido ANTES do load
# — uma transferencia truncada ja passou despercebida uma vez, porque o
# `compose up` seguinte subiu feliz usando a imagem antiga.
#
# Exposicao: nenhuma porta publicada, nem no host nem no roteador. O
# cloudflared roda em container na mesma rede `nasfinance` e alcanca o app
# em http://nasfinance-app:8080. Assim nao ha porta para escolher, nem
# regra de firewall para abrir, nem confusao entre 127.0.0.1 e 172.17.0.1.
# =============================================================

services:
  db:
    image: postgres:17-alpine
    container_name: nasfinance-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Locale e collation fixos: mudar depois exigiria recriar o cluster.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'

    volumes:
      # Bind mount explicito, nao volume nomeado. Um volume nomeado
      # desaparece com `docker compose down -v` digitado sem pensar; um
      # bind mount sobrevive. Exige um `chown 70:70` unico no diretorio
      # (70 e o uid do postgres dentro da imagem alpine).
      - /opt/nasfinance/postgres:/var/lib/postgresql/data

    # Sem `ports`: o banco NAO e exposto ao host. Apenas o container da
    # aplicacao o alcanca, pela rede interna do compose. Publicar 5432
    # no host seria expor o banco a qualquer processo da maquina, sem
    # ganho nenhum.
    networks:
      - nasfinance

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    # Tuning para a VM de 954 MiB. Os defaults do Postgres assumem uma
    # maquina dedicada; aqui o banco divide a RAM com a JVM e com o
    # cloudflared. Os valores antigos (96MB/256MB) foram calibrados para
    # o nas-server, que tinha 3,2 GB. Uso real medido deste banco: 31 MiB.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20

    deploy:
      resources:
        limits:
          # 256M contra 31 MiB de uso real: folga de 8x. O limite nao
          # reserva nada — existe para conter vazamento, nao para
          # dimensionar o uso normal.
          memory: 256M

    logging: &logging
      driver: json-file
      options:
        # Sem limite, o log cresce ate encher o disco raiz de 30G —
        # que derrubaria TODOS os servicos do servidor, nao so este.
        max-size: '10m'
        max-file: '3'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nasfinance:latest
    container_name: nasfinance-app
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SHORTCUT_TOKEN: ${SHORTCUT_TOKEN}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}

    # SEM `ports`. De proposito.
    #
    # O cloudflared roda num container que entra nesta mesma rede e alcanca
    # o app pelo nome, em `http://nasfinance-app:8080`. Publicar porta no
    # host seria so superficie de ataque a mais, sem nenhum ganho.
    #
    # Isso tambem elimina tres armadilhas da montagem anterior: a escolha de
    # porta livre, a regra de ufw liberando 172.16.0.0/12, e a confusao
    # entre 127.0.0.1 e 172.17.0.1 ao diagnosticar.
    #
    # Para inspecionar o app a partir do host:
    #   docker run --rm --network nasfinance curlimages/curl -s \
    #     http://nasfinance-app:8080/q/health/ready
    networks:
      - nasfinance

    # ---------- Endurecimento ----------
    # Este e o container exposto ao tunel, entao e o que precisa de
    # superficie de ataque minima.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    tmpfs:
      # Com read_only, o sistema de arquivos inteiro fica imutavel. A JVM
      # ainda precisa escrever em /tmp (arquivos de perf, extracao de
      # bibliotecas nativas), entao damos um tmpfs em memoria: gravavel,
      # volatil, e sem permissao de execucao.
      - /tmp:rw,noexec,nosuid,size=64m

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/q/health/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      # A JVM leva alguns segundos para subir; sem start_period o
      # container seria marcado como unhealthy antes de terminar o boot.
      #
      # 120s e nao 60s porque esta VM tem 1 OCPU compartilhado. Com a
      # margem curta, o healthcheck falha durante o proprio boot e o
      # `restart: unless-stopped` entra num laco de reinicio — sintoma
      # que parece crash da aplicacao, mas e so impaciencia.
      start_period: 120s

    deploy:
      resources:
        limits:
          # O Dockerfile usa MaxRAMPercentage=65, entao o heap maximo
          # fica em ~330MB, sobrando o resto para metaspace, threads e
          # buffers da JVM.
          memory: 512M

    logging: *logging

networks:
  nasfinance:
    name: nasfinance
    driver: bridge
