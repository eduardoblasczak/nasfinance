<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500&display=swap">
  <style>
    :root {
      --void: #000000; --fg: #f0f0f0; --fg-dim: #949494;
      --fg-faint: #565656; --fg-ghost: #2e2e2e;
      --accent: #25d98a; --accent-2: #21d4c2;
      --ease: cubic-bezier(.22, 1, .36, 1);
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--void); color: var(--fg); font-family: 'Space Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-2); }

    .eyebrow { font-family: var(--font-mono); font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--fg-faint); }
    .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* Tecla do teclado numérico. 56px de altura: acima do mínimo de 44px,
       porque é o controle mais usado da tela e o erro de digitação aqui
       custa um lançamento errado. */
    .key {
      min-height: 56px; background: transparent; border: 1px solid var(--fg-ghost);
      color: var(--fg); font-family: var(--font-mono); font-size: 19px; font-weight: 300;
      cursor: pointer; transition: background .25s var(--ease), border-color .25s var(--ease), transform .12s var(--ease);
    }
    .key:hover { border-color: var(--fg-faint); background: rgba(255,255,255,.03); }
    /* O recuo no toque devolve a sensação física da tecla afundando. */
    .key:active { transform: scale(.94); background: rgba(37,217,138,.12); border-color: var(--accent); }

    .seg {
      min-height: 46px; flex-grow: 1; background: transparent;
      border: 1px solid var(--fg-ghost); color: var(--fg-dim);
      font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em;
      cursor: pointer; transition: all .4s var(--ease);
    }
    .seg[data-on="1"] { color: var(--accent); border-color: rgba(37,217,138,.55); background: rgba(37,217,138,.13); }

    .pick {
      min-height: 44px; padding: 0 14px; background: transparent;
      border: 1px solid var(--fg-ghost); color: var(--fg-dim);
      font-size: 12px; cursor: pointer; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 8px;
      transition: all .4s var(--ease);
    }
    .pick[data-on="1"] { color: var(--fg); border-color: rgba(37,217,138,.5); background: rgba(37,217,138,.1); }

    .cta {
      width: 100%; min-height: 54px; background: var(--accent); border: none;
      color: var(--void); font-family: var(--font-mono); font-size: 12px;
      letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
      transition: background .4s var(--ease), transform .4s var(--ease);
    }
    .cta:hover { background: var(--accent-2); }
    .cta:active { transform: scale(.985); }
    .cta[data-off="1"] { background: var(--fg-ghost); color: var(--fg-faint); cursor: not-allowed; }

    .rise { animation: rise .7s var(--ease) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

    /* Confirmação: o círculo se expande e o traço do "certo" se desenha.
       stroke-dashoffset animado é o que dá a sensação de escrita. */
    .ok-ring { animation: ring .55s var(--ease) both; transform-origin: center; }
    @keyframes ring { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .ok-check { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .5s var(--ease) .3s both; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; background: #000000; overflow: hidden;">
  <div style="height: 100%; overflow-y: auto; padding: 0 20px;">

    <div style="height: 56px;"></div>

    <!-- CABECALHO -->
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px;">
      <div class="eyebrow">novo lançamento</div>
      <div style="cursor: pointer; color: #565656; font-size: 22px; line-height: 1; padding: 8px;">×</div>
    </div>

    <sc-if value="{{ saved }}" hint-placeholder-val="{{ false }}">
      <!-- ESTADO DE CONFIRMACAO -->
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 620px; gap: 26px;">
        <svg width="76" height="76" viewBox="0 0 76 76" fill="none">
          <circle class="ok-ring" cx="38" cy="38" r="36" stroke="#25d98a" stroke-width="1.5" opacity=".45"/>
          <circle class="ok-ring" cx="38" cy="38" r="26" stroke="#25d98a" stroke-width="1" opacity=".25"/>
          <path class="ok-check" d="M25 39 L34 48 L52 29" stroke="#25d98a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div style="text-align: center;">
          <div class="num" style="font-size: 30px; font-weight: 300; color: #f0f0f0; letter-spacing: -.03em;">{{ savedAmount }}</div>
          <div style="font-size: 13px; color: #565656; margin-top: 10px;">{{ savedMeta }}</div>
        </div>
        <button class="cta" onClick="{{ reset }}" style="width: 220px;">novo lançamento</button>
      </div>
    </sc-if>

    <sc-if value="{{ editing }}" hint-placeholder-val="{{ true }}">
      <div class="rise">

        <!-- DESPESA / RECEITA -->
        <div style="display: flex; gap: 8px; padding: 26px 0 34px 0;">
          <button class="seg" data-on="{{ isExpense }}" onClick="{{ setExpense }}">Despesa</button>
          <button class="seg" data-on="{{ isIncome }}" onClick="{{ setIncome }}">Receita</button>
        </div>

        <!-- VALOR -->
        <div class="eyebrow" style="margin-bottom: 12px;">valor</div>
        <div style="display: flex; align-items: baseline; gap: 8px; border-bottom: 1px solid {{ amountBorder }}; padding-bottom: 14px; margin-bottom: 30px; transition: border-color .4s var(--ease);">
          <span class="num" style="font-size: 20px; color: #565656;">R$</span>
          <span class="num" style="font-size: 44px; font-weight: 300; letter-spacing: -.035em; color: {{ amountColor }};">{{ amount }}</span>
        </div>

        <!-- CATEGORIA -->
        <div class="eyebrow" style="margin-bottom: 12px;">categoria</div>
        <div style="display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 28px;">
          <sc-for list="{{ categories }}" as="c" hint-placeholder-count="6">
            <button class="pick" data-on="{{ c.on }}" onClick="{{ c.pick }}">
              <span style="width: 5px; height: 5px; background: {{ c.color }}; flex-shrink: 0;"></span>
              {{ c.name }}
            </button>
          </sc-for>
        </div>

        <!-- CONTA -->
        <div class="eyebrow" style="margin-bottom: 12px;">de onde saiu</div>
        <div style="display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 32px;">
          <sc-for list="{{ accounts }}" as="a" hint-placeholder-count="4">
            <button class="pick" data-on="{{ a.on }}" onClick="{{ a.pick }}">{{ a.name }}</button>
          </sc-for>
        </div>

        <!-- TECLADO -->
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin-bottom: 22px;">
          <sc-for list="{{ keypad }}" as="k" hint-placeholder-count="12">
            <button class="key" onClick="{{ k.press }}">{{ k.label }}</button>
          </sc-for>
        </div>

        <button class="cta" data-off="{{ blocked }}" onClick="{{ save }}">{{ ctaLabel }}</button>

        <div style="height: 40px;"></div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#25d98a","options":["#25d98a","#21d4c2","#8052ff","#ffb829"],"section":"Identidade"}}'>
/* =====================================================================
   nasFinance — Lançamento rápido (celular)

   Espelha o fluxo do Atalho do iPhone: valor, categoria, conta — nessa
   ordem, porque é a ordem em que a pessoa pensa ao sair do caixa.
   O botão só libera quando os três estão preenchidos.
   ===================================================================== */

const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const SERIES = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#9085e9'];

const EXPENSE_CATS = ['Mercado', 'Alimentação', 'Transporte', 'Moradia', 'Lazer', 'Saúde'];
const INCOME_CATS = ['Salário', 'Freelance', 'Reembolso', 'Rendimentos'];
const ACCOUNTS = ['Conta Corrente', 'Vale Refeição', 'Cartão de Crédito', 'Dinheiro'];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { flow: 'EXPENSE', cents: 0, cat: null, acc: null, saved: false, savedSnapshot: null };
  }

  press(key) {
    if (key === '←') {
      this.setState({ cents: Math.floor(this.state.cents / 10) });
      return;
    }
    if (key === '00') {
      this.setState({ cents: Math.min(this.state.cents * 100, 99999999) });
      return;
    }
    const next = this.state.cents * 10 + Number(key);
    if (next > 99999999) return;
    this.setState({ cents: next });
  }

  save() {
    const { cents, cat, acc, flow } = this.state;
    if (!cents || cat === null || acc === null) return;
    const cats = flow === 'EXPENSE' ? EXPENSE_CATS : INCOME_CATS;
    this.setState({
      saved: true,
      savedSnapshot: {
        amount: (flow === 'EXPENSE' ? '− ' : '+ ') + BRL.format(cents / 100),
        meta: cats[cat] + ' · ' + ACCOUNTS[acc]
      }
    });
  }

  renderVals() {
    const state = this.state;
    const cats = state.flow === 'EXPENSE' ? EXPENSE_CATS : INCOME_CATS;

    const reais = Math.floor(state.cents / 100);
    const centavos = String(state.cents % 100).padStart(2, '0');
    const amountText = reais.toLocaleString('pt-BR') + ',' + centavos;

    const complete = state.cents > 0 && state.cat !== null && state.acc !== null;
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0', '←'];

    let ctaLabel = 'registrar';
    if (state.cents === 0) ctaLabel = 'informe o valor';
    else if (state.cat === null) ctaLabel = 'escolha a categoria';
    else if (state.acc === null) ctaLabel = 'escolha a conta';

    return {
      editing: !state.saved,
      saved: state.saved,
      savedAmount: state.savedSnapshot ? state.savedSnapshot.amount : '',
      savedMeta: state.savedSnapshot ? state.savedSnapshot.meta : '',
      reset: () => this.setState({ flow: 'EXPENSE', cents: 0, cat: null, acc: null, saved: false, savedSnapshot: null }),

      isExpense: state.flow === 'EXPENSE' ? '1' : '0',
      isIncome: state.flow === 'INCOME' ? '1' : '0',
      /* Trocar de despesa para receita zera a categoria: as listas são
         diferentes, e manter o índice apontaria para outra categoria
         silenciosamente. */
      setExpense: () => this.setState({ flow: 'EXPENSE', cat: null }),
      setIncome: () => this.setState({ flow: 'INCOME', cat: null }),

      amount: amountText,
      amountColor: state.cents > 0 ? '#f0f0f0' : '#2e2e2e',
      amountBorder: state.cents > 0 ? 'rgba(37,217,138,.5)' : '#2e2e2e',

      categories: cats.map((name, i) => ({
        name: name,
        color: SERIES[i % SERIES.length],
        on: state.cat === i ? '1' : '0',
        pick: () => this.setState({ cat: i })
      })),

      accounts: ACCOUNTS.map((name, i) => ({
        name: name,
        on: state.acc === i ? '1' : '0',
        pick: () => this.setState({ acc: i })
      })),

      keypad: keys.map((k) => ({ label: k, press: () => this.press(k) })),

      blocked: complete ? '0' : '1',
      ctaLabel: ctaLabel,
      save: () => this.save()
    };
  }
}
</script>
</body>
</html>
