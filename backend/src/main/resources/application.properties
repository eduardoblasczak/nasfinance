# =============================================================
# nasFinance - configuracao da aplicacao
# =============================================================
# Sintaxe de profile do Quarkus:
#   chave        -> vale para todos os profiles
#   %dev.chave   -> so em desenvolvimento (./mvnw quarkus:dev)
#   %prod.chave  -> so no JAR/container de producao
#   %test.chave  -> so nos testes automatizados
#
# ${VAR:default} le a variavel de ambiente VAR e cai no default se ausente.
# Isso permite o mesmo build rodar local e no servidor, mudando so o .env.
# =============================================================

quarkus.application.name=nasfinance

# -------------------------------------------------------------
# HTTP
# -------------------------------------------------------------
quarkus.http.port=8080
# Escuta em todas as interfaces: dentro do container o acesso vem de fora
quarkus.http.host=0.0.0.0

# Compressao economiza banda do Cloudflare Tunnel (que passa por WiFi no NAS)
quarkus.http.enable-compression=true

# -------------------------------------------------------------
# Banco de dados
# -------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:nasfinance}
quarkus.datasource.password=${DB_PASSWORD:nasfinance}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nasfinance}

# Pool enxuto: o servidor tem 3,2GB de RAM e roda outros 6 servicos.
# Uso pessoal nao precisa de 20 conexoes (o default do Agroal).
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.acquisition-timeout=10s

# -------------------------------------------------------------
# Hibernate ORM
# -------------------------------------------------------------
# Quem cria e altera tabela e o Flyway, nunca o Hibernate. Deixar o Hibernate
# gerar schema em producao e receita para perda de dados.
#
# 'validate': o Hibernate nao altera nada, apenas confere na subida que cada
# entidade bate com o schema real. Se divergir, o app falha imediatamente no
# boot, em vez de quebrar em runtime na primeira query.
#
# (Esta propriedade substitui a antiga `quarkus.hibernate-orm.database.generation`,
#  deprecada no Hibernate ORM 7. Definir as duas causa conflito.)
quarkus.hibernate-orm.schema-management.strategy=validate

# -------------------------------------------------------------
# Flyway (versionamento de schema)
# -------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
# baseline-on-migrate permite apontar para um banco que ja tinha tabelas
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# -------------------------------------------------------------
# Autenticacao do Atalho do iPhone
# -------------------------------------------------------------
# Token estatico (Bearer) usado APENAS pelo endpoint /api/v1/quick-entry.
# Em producao vem do .env; o default abaixo so existe para o dev local.
# NUNCA versionar o token real.
nasfinance.shortcut.token=${SHORTCUT_TOKEN:dev-token-trocar-em-producao}

# Fuso usado para resolver "hoje" quando o Atalho nao manda a data
nasfinance.timezone=${APP_TIMEZONE:America/Sao_Paulo}

# -------------------------------------------------------------
# Observabilidade (integra com o Prometheus + Grafana que ja rodam no NAS)
# -------------------------------------------------------------
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.smallrye-health.root-path=/q/health

# -------------------------------------------------------------
# OpenAPI / Swagger UI
# -------------------------------------------------------------
quarkus.smallrye-openapi.path=/q/openapi
mp.openapi.extensions.smallrye.info.title=nasFinance API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=API de controle de financas pessoais

# =============================================================
# DESENVOLVIMENTO
# =============================================================
# Swagger UI em http://localhost:8080/q/swagger-ui
%dev.quarkus.swagger-ui.always-include=true

# CORS: o Vite roda em :5173 e o Quarkus em :8080, origens diferentes.
# O proxy do Vite ja resolve isso, mas manter habilitado ajuda a testar
# a API direto de outra ferramenta durante o desenvolvimento.
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173

# Log das queries SQL geradas pelo Hibernate: essencial para aprender o que
# o Panache esta realmente executando por tras dos metodos estaticos.
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.format-sql=true
%dev.quarkus.log.category."br.com.ebls.nasfinance".level=DEBUG

# Desativa Dev Services: usamos o PostgreSQL 17 instalado nativamente no
# Windows (porta 5432), nao um container efemero via Testcontainers.
%dev.quarkus.devservices.enabled=false

# =============================================================
# PRODUCAO
# =============================================================
%prod.quarkus.log.level=INFO
%prod.quarkus.log.console.json=false
# Em producao nao ha Swagger UI exposto
%prod.quarkus.swagger-ui.always-include=false

# =============================================================
# TESTES
# =============================================================
# Testes usam banco separado para nunca tocar nos dados de desenvolvimento
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${TEST_DB_NAME:nasfinance_test}
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.devservices.enabled=false
