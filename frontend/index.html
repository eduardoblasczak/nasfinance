<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: no iPhone o conteúdo vai até as bordas e cada
         barra flutuante se afasta do notch e do indicador de início com
         env(safe-area-inset-*). Sem isso o Safari pinta faixas pretas fixas. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Tema escuro por decisão, não por preferência do sistema: as cores das
         séries foram validadas contra a superfície escura. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Controle de finanças pessoais" />
    <title>nasFinance</title>

    <!-- Ícone: o cubo da marca em SVG, com variação clara/escura interna
         (prefers-color-scheme dentro do próprio arquivo). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Instalável na tela inicial. crossorigin="use-credentials" porque o
         Cloudflare Access protege tudo: sem o cookie, o navegador busca o
         manifest anonimamente, recebe a página de login do Access no lugar
         do JSON e ignora o manifest em silêncio. .json, e não .webmanifest,
         para o Quarkus servir com um content-type que ele já conhece. -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />

    <!-- iOS: abre sem a barra do Safari e com a barra de status por cima do
         conteúdo — o app já recua do notch com env(safe-area-inset-top). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="nasFinance" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
